$kind: http-request
name: 'Update Profile'
method: PATCH
url: '{{base_url}}/api/profiles/:uuid/'
order: 4000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: uuid
    value: ''
    description: 'Profile UUID'
body:
  type: json
  content: |-
    {
      "profession": "Updated Profession"
    }
