$kind: http-request
name: 'Refresh Token'
method: POST
url: '{{base_url}}/api/auth/refresh/'
order: 2000
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      if (res.access) {
        pm.environment.set("access_token", res.access);
      }
