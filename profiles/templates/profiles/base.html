<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Matrimony{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18332d;
            --muted: #64746e;
            --line: #dce5df;
            --paper: #fff;
            --canvas: #f1f5f1;
            --green: #276b51;
            --green-soft: #e4f1e8;
            --orange: #b85c35;
            --orange-soft: #fff0e6;
            --red: #a53e36;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--canvas); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        a { color: inherit; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 68px; padding: 0 max(24px, calc((100vw - 1120px) / 2)); background: var(--ink); color: #fff; }
        .brand { font-size: 16px; font-weight: 750; letter-spacing: .08em; text-decoration: none; }
        .topbar a { color: #e5f1e9; font-size: 14px; text-decoration: none; }
        .nav { display: flex; align-items: center; gap: 24px; }
        main { width: min(1120px, calc(100% - 40px)); margin: 38px auto; }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
        .eyebrow { margin: 0 0 6px; color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); line-height: 1.15; }
        h2 { margin: 0; font-size: 17px; }
        .subheading { margin: 8px 0 0; color: var(--muted); }
        .button { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border: 1px solid var(--green); border-radius: 5px; background: var(--green); color: #fff; font-weight: 650; text-decoration: none; white-space: nowrap; cursor: pointer; }
        .button:hover { background: #1c553f; }
        .button.secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
        .button.secondary:hover { background: #f7faf7; }
        .button.small { min-height: 34px; padding: 0 11px; font-size: 13px; }
        .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 26px; }
        .metric { min-height: 118px; padding: 19px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
        .metric-label { color: var(--muted); font-size: 13px; font-weight: 600; }
        .metric-value { display: block; margin-top: 10px; font-size: 31px; font-weight: 700; line-height: 1; }
        .metric.approved { border-top: 3px solid var(--green); }
        .metric.pending { border-top: 3px solid var(--orange); }
        .section { overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
        .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 20px; border-bottom: 1px solid var(--line); }
        .section-heading a { color: var(--green); font-size: 14px; font-weight: 650; text-decoration: none; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 13px 20px; border-bottom: 1px solid #edf1ee; }
        th { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
        tbody tr:last-child td { border-bottom: 0; }
        .profile-name { font-weight: 650; }
        .code { color: var(--muted); font-size: 13px; }
        .section-heading-link { color: var(--green); font-size: 13px; font-weight: 650; text-decoration: none; }
        .section-heading-link:hover { text-decoration: underline; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .status { display: inline-block; padding: 4px 9px; border-radius: 20px; background: #eef1ef; color: #46564f; font-size: 12px; font-weight: 650; white-space: nowrap; }
        .status-approved { background: var(--green-soft); color: var(--green); }
        .status-pending_review { background: var(--orange-soft); color: #9b4c2d; }
        .empty { padding: 36px 20px; color: var(--muted); text-align: center; }
        .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
        .toolbar label, .form-field label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; font-weight: 650; }
        input, select, textarea { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #cbd7cf; border-radius: 4px; background: var(--paper); color: var(--ink); font: inherit; }
        input:focus, select:focus, textarea:focus { border-color: var(--green); outline: 2px solid #276b5122; }
        textarea { min-height: 110px; resize: vertical; }
        .search-control { flex: 1 1 260px; }
        .status-control { flex: 0 1 200px; }
        .form-panel { max-width: 800px; padding: 24px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px 16px; }
        .form-field.full { grid-column: 1 / -1; }
        .field-error, .errorlist { margin: 5px 0 0; color: var(--red); font-size: 13px; }
        .errorlist { padding-left: 18px; }
        .form-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
        .messages { margin: 0 0 18px; padding: 12px 16px; border: 1px solid #b7d9c1; border-radius: 5px; background: var(--green-soft); color: var(--green); }
        .pagination { display: flex; justify-content: space-between; gap: 16px; padding: 15px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
        .pagination a { color: var(--green); font-weight: 650; text-decoration: none; }
        @media (max-width: 760px) {
            .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .topbar { padding: 0 20px; }
            .nav { gap: 14px; }
        }
        @media (max-width: 520px) {
            main { width: min(100% - 28px, 1120px); margin-top: 26px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-field.full { grid-column: auto; }
            .form-panel { padding: 17px; }
            th, td { padding: 11px 13px; }
            .topbar a { font-size: 12px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'home' %}">MATRIMONY</a>
        <nav class="nav" aria-label="Main navigation">
            <a href="{% url 'web-profile-list' %}">Profiles</a>
            <a href="{% url 'admin:index' %}">Admin</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<p class="messages">{{ message }}</p>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
